<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Atomos" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="description" content="Every atom, up close. Atomos: a collection of the 118 elements, unlocked puzzle by puzzle." />
    <title>Atomos</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The header, on every screen but the 3D atom full screen, never moving: the mark at its
         left (Home, and where Nu rests). On Home the wordmark, Search and Settings follow it;
         everywhere else the trail from Home to the screen open (src/ui/crumbs.ts), then the
         screen's own tools on the right (Play's Difficulty). src/shell.ts. -->
    <header class="nav" id="nav" aria-label="Main">
      <button class="nav-logo" id="nav-logo" aria-label="Atomos: home" title="Home"></button>
      <h1 class="nav-title" id="nav-title">Atomos</h1>
      <nav class="crumbs" id="crumbs" aria-label="You are here" hidden></nav>
      <span class="nav-tools" id="nav-tools"></span>
      <span class="nav-aside" id="nav-aside" hidden></span>
      <button class="nav-btn" id="nav-search" aria-label="Search atoms and games" aria-haspopup="dialog"></button>
      <button class="nav-btn" id="nav-settings" aria-label="Settings" aria-current="false"></button>
    </header>
    <!-- The bar on Home: Collect, Atlas and Play in a pill at the foot. src/ui/dock.ts. -->
    <nav class="dock" id="dock" aria-label="Sections">
      <button id="nav-collect"><span class="nav-ico"></span><span class="nav-lab">Collect</span></button>
      <button id="nav-gallery"><span class="nav-ico"></span><span class="nav-lab">Atlas</span></button>
      <button id="nav-puzzles"><span class="nav-ico"></span><span class="nav-lab">Play</span></button>
    </nav>

    <div id="gallery-screen">
      <!-- The Atlas (src/gallery/atlas.ts): views, search and Color, the map or Details. -->
      <div id="atlas"></div>

      <section id="loupe-screen" class="loupe-screen" hidden aria-label="One atom, up close">
        <div class="atom-box" id="atom-box"></div>
        <div class="atom-tabs" id="atom-tabs"></div>
        <div class="atom-panel" id="atom-panel" role="tabpanel" hidden></div>
        <canvas id="loupe" aria-label="The selected atom. Swipe up and down to glide through its orbitals, sideways for more or less focus; pinch to zoom, two fingers to turn it."></canvas>
        <!-- Over the 3D atom (src/gallery/detail.ts, render/explorer.ts): the render style top
             left; the frame rate, Play/Pause, full screen and the folded shortcuts top right; the
             ladder of orbitals on the right edge; "− Orbital focus +" at the foot; the scale circles bottom left and the nucleus bottom right. -->
        <div class="loupe-hud" id="loupe-hud">
          <div class="lh-tl" id="loupe-tl"></div>
          <div class="lh-tr">
            <div class="lh-btns" id="loupe-btns"><div class="lh-fps" id="loupe-fps" aria-hidden="true"></div></div>
            <div class="lh-keys" id="loupe-keys"></div>
          </div>
          <div class="lh-explorer" id="loupe-explorer"></div>
          <div class="dive-readout" id="dive-readout" aria-hidden="true"></div>
          <div class="loupe-tools">
            <div class="scale-legend" id="scale-legend" aria-label="Scale circles round the atom, by diameter"></div>
            <div class="style-switch" id="style-switch" role="group" aria-label="The nucleus up close"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Collect: one period's atoms and how far each is collected (src/gallery/collect.ts). -->
    <section id="home-screen" class="home-screen" hidden aria-label="Home"><div class="home-body" id="home-body"></div></section>
    <section id="collect-screen" class="collect-screen" hidden aria-label="Collect"></section>

    <div id="app" hidden>
      <canvas id="overlay" aria-label="The puzzle. Swipe to slide nuclei, or drag round a ring to turn it."></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="edge" id="edge" aria-hidden="true">ATOMOS 400 &#9656; PLATE 0001</div>

      <div class="build-bar" id="build-bar"></div>
      <section class="build-home" id="build-home" aria-label="Build this atom">
        <div class="bh-stage" id="bh-stage">
          <canvas id="bh-atom" aria-label="The atom you are building."></canvas>
          <div class="bh-empty" id="bh-empty" hidden>Nucleus not built</div>
          <button type="button" class="bh-view" id="bh-view" aria-label="View the atom full screen"></button>
        </div>
        <div class="bh-bars co-bars" id="bh-progress" role="group"></div>
        <div class="bh-in" id="bh-in"></div>
      </section>
      <div class="build-head" id="build-head" hidden></div>

      <div class="bottom" id="build-foot"></div>

    </div>

    <section id="puzzles-screen" hidden aria-label="Puzzles">
      <div class="pg-home" id="pg-home">
        <div class="pg-home-in">
          <h1 class="sr-only">Puzzles</h1>
          <div class="pg-focus" id="pg-focus" role="region">
            <div class="pg-focus-in">
              <canvas class="pg-demo" id="pg-demo" aria-hidden="true"></canvas>
              <div class="pg-focus-text"><b class="pg-focus-name" id="pg-focus-name"></b><p class="pg-focus-goal" id="pg-focus-goal"></p></div>
              <div class="pg-levels" id="pg-levels" role="radiogroup"></div>
            </div>
          </div>
          <div class="pg-list" id="pg-list"></div>
        </div>
      </div>
      <div class="pg-game" id="pg-game" hidden>
        <div class="pg-gbar" id="pg-gbar"></div>
        <div class="pg-play" id="pg-play">
          <canvas id="pg-canvas" aria-label="The puzzle."></canvas>
        </div>
        <div class="pg-planned" id="pg-planned" hidden>
          <p class="pg-result">Not built yet</p>
          <p class="muted">On the progression map, with no board to play yet.</p>
        </div>
        <div class="pg-foot" id="pg-foot">
          <div class="pg-gen" id="pg-gen"><div class="pg-bar" id="pg-bar" hidden></div></div>
        </div>
      </div>
    </section>

    <section id="settings-screen" class="settings-screen" hidden aria-label="Settings">
      <div class="sheet settings-page" id="settings-page"></div>
    </section>

    <section id="icons-screen" class="settings-screen" hidden aria-label="Icons">
      <div class="icon-page" id="icon-page"></div>
    </section>

    <section id="components-screen" class="settings-screen" hidden aria-label="Components">
      <div class="icon-page cl-page" id="component-page"></div>
    </section>

    <div class="modal ui-modal" id="modal" hidden>
      <div class="sheet ui-modal-card" id="modal-sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
