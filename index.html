<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0c0b0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atomos" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="description" content="Build atoms, puzzle by puzzle. Atomos prototype: hydrogen to neon." />
    <title>Atomos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="atom" aria-label="The atom you are building."></canvas>
      <canvas id="overlay" aria-label="The puzzle. Swipe to slide nuclei, or drag round a ring to turn it."></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="edge" id="edge" aria-hidden="true">ATOMOS 400 &#9656; PLATE 0001</div>

      <header class="top">
        <button class="badge" id="badge" aria-label="Open this element's card">
          <span class="badge-z" id="badge-z">1</span>
          <span class="badge-sym" id="badge-sym">H</span>
          <span class="badge-text">
            <span class="badge-name" id="badge-name">Hydrogen</span>
            <span class="badge-config" id="badge-config">bare nucleus</span>
          </span>
        </button>
        <nav class="top-actions">
          <button class="icon-btn" id="btn-map" aria-label="Open the map">Map</button>
          <button class="icon-btn" id="btn-settings" aria-label="Open settings">Settings</button>
        </nav>
      </header>

      <div class="stage" id="stage" aria-live="polite"></div>

      <div class="bottom">
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <div class="bottom-actions">
          <button class="text-btn" id="btn-undo">Undo</button>
          <button class="text-btn" id="btn-restart">Restart puzzle</button>
          <button class="text-btn why" id="btn-why">Why?</button>
        </div>
      </div>

      <div class="modal" id="modal" hidden>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
      </div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
