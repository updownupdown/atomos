<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0c0b0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atomos" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="description" content="Every atom, up close. Atomos: a collection of the 118 elements." />
    <title>Atomos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="gallery-screen">
      <canvas id="gal" aria-label="Every element as an atom. Drag to move, pinch to zoom, tap one to look closer."></canvas>
      <div id="gal-labels" class="gal-labels" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <header class="gal-top">
        <div class="gal-title">
          <span class="gal-name">Atomos</span>
          <span class="gal-sub"><span id="gal-count">0 of 118</span> collected</span>
        </div>
        <nav class="gal-actions">
          <button class="icon-btn" id="gal-build" aria-label="Open the builder">Build</button>
        </nav>
      </header>
      <div class="gal-hover" id="gal-hover" hidden></div>
      <footer class="gal-bottom">
        <div class="seg layout-switch" id="layout-switch" role="group" aria-label="Arrangement"></div>
        <p class="layout-note" id="layout-note"></p>
      </footer>

      <section id="loupe-screen" class="loupe-screen" hidden aria-label="One atom, up close">
        <canvas id="loupe" aria-label="The selected atom. Drag to turn it, swipe sideways for the next element."></canvas>
        <div id="ring-labels" class="ring-labels" aria-hidden="true"></div>
        <header class="loupe-top">
          <button class="icon-btn" id="loupe-back" aria-label="Back to the gallery">‹ Gallery</button>
          <div class="seg style-switch" id="style-switch" role="group" aria-label="How the atom is drawn"></div>
        </header>
        <button class="arrow prev" id="loupe-prev" aria-label="Previous element">‹</button>
        <button class="arrow next" id="loupe-next" aria-label="Next element">›</button>
        <button class="loupe-card" id="card" aria-expanded="false" aria-controls="sheet" aria-label="Open everything about this element"></button>
        <div class="data-sheet" id="sheet" hidden role="dialog" aria-label="Everything about this element">
          <div class="sheet-head">
            <h2 id="sheet-title"></h2>
            <button class="text-btn" id="sheet-build">Build it</button>
            <button class="icon-btn" id="sheet-close" aria-label="Close">Close</button>
          </div>
          <div class="seg sheet-tabs" id="sheet-tabs" role="tablist"></div>
          <div class="sheet-body" id="sheet-body"></div>
        </div>
      </section>
    </div>

    <div id="app" hidden>
      <canvas id="atom" aria-label="The atom you are building. Hold, tap or drag here to launch electrons."></canvas>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="edge" id="edge" aria-hidden="true">ATOMOS 400 &#9656; PLATE 0001</div>

      <header class="top">
        <button class="badge" id="badge" aria-label="Open this element's card">
          <span class="badge-z" id="badge-z">1</span>
          <span class="badge-sym" id="badge-sym">H</span>
          <span class="badge-text">
            <span class="badge-name" id="badge-name">Hydrogen</span>
            <span class="badge-config" id="badge-config">bare nucleus</span>
          </span>
        </button>
        <nav class="top-actions">
          <button class="icon-btn" id="btn-gallery" aria-label="Back to the gallery">Gallery</button>
          <button class="icon-btn" id="btn-map" aria-label="Open the map">Map</button>
          <button class="icon-btn" id="btn-settings" aria-label="Open settings">Settings</button>
        </nav>
      </header>

      <div class="electrons" id="electrons" aria-label="Electrons placed"></div>

      <aside class="ladder" id="ladder" aria-label="Energy levels for the next electron"></aside>

      <div class="aim" id="aim" aria-hidden="true"></div>

      <div class="bottom">
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <div class="spectrum-wrap">
          <canvas id="spectrum" aria-label="Light this atom has released"></canvas>
          <div class="spectrum-labels"><span>X-ray</span><span>ultraviolet</span><span>visible</span><span>infrared</span></div>
        </div>
        <div class="bottom-actions">
          <button class="text-btn" id="btn-undo">Undo</button>
          <button class="text-btn" id="btn-restart">Restart atom</button>
          <div class="launch-switch seg" id="launch-switch" role="group" aria-label="Launch style"></div>
        </div>
      </div>

      <div class="assist" id="assist" hidden></div>

      <div class="modal" id="modal" hidden>
        <div class="data-sheet" id="sheet" role="dialog" aria-modal="true"></div>
      </div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
