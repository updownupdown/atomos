<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101112" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atomos" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="description" content="Every atom, up close. Atomos: a collection of the 118 elements, unlocked puzzle by puzzle." />
    <title>Atomos</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="nav" id="nav" aria-label="Main">
      <button class="nav-logo" id="nav-logo" aria-label="Atomos: back to the gallery" title="Atomos"></button>
      <nav class="nav-tabs" aria-label="Sections">
        <button id="nav-gallery" aria-current="page"><span class="nav-ico"></span><span class="nav-lab">Gallery</span></button>
        <button id="nav-atom" aria-current="false"><span class="nav-ico"></span><span class="nav-lab">Atom</span></button>
        <button id="nav-puzzles" aria-current="false"><span class="nav-ico"></span><span class="nav-lab">Practice</span></button>
        <button id="nav-settings" aria-current="false"><span class="nav-ico"></span><span class="nav-lab">Settings</span></button>
      </nav>
      <div class="nav-end" aria-hidden="true"></div>
    </header>

    <!-- Atom screens: pick View or Build for this atom; Build shows its progress.
         See src/ui/modebar.ts. -->
    <div class="mode-row" id="mode-row" hidden>
      <div class="mode-seg" id="mode-seg"></div>
    </div>

    <div id="gallery-screen">
      <div class="mode-row gal-modes" id="gal-modes">
        <div class="mode-seg" id="gal-mode-seg"></div>
      </div>
      <canvas id="gal" aria-label="Every element as an atom. Drag to move, pinch to zoom, tap one to look closer."></canvas>
      <div id="gal-labels" class="gal-labels" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <header class="gal-top">
        <div class="gal-title">
                    <button class="tool-chip look-chip" id="look-chip" aria-label="Color the tiles by"></button>
          <div class="look-legend" id="look-legend" hidden></div>
        </div>
      </header>
      <div class="gal-hover" id="gal-hover" hidden></div>
      <div class="gal-details" id="gal-details" hidden></div>
      <div class="gal-collection" id="gal-collection" hidden></div>
      <footer class="gal-bottom">
        <div class="seg layout-switch lens-switch" id="lens-switch" role="group" aria-label="Arrangement" hidden></div>
        <p class="layout-note" id="layout-note"></p>
      </footer>

      <section id="loupe-screen" class="loupe-screen" hidden aria-label="One atom, up close">
        <div class="atom-tabs" id="atom-tabs"></div>
        <div class="atom-panel" id="atom-panel" role="tabpanel" hidden></div>
        <canvas id="loupe" aria-label="The selected atom. Swipe up and down to glide through its orbitals, sideways for more or less focus; pinch to zoom, two fingers to turn it."></canvas>
        <!-- Over the 3D atom (src/gallery/detail.ts, render/explorer.ts): the microscope top
             left; the frame rate, Play/Pause, full screen and the folded shortcuts top right; the
             ladder of orbitals on the right edge; "− Orbital focus +" at the foot; the scale circles bottom left and the nucleus bottom right. -->
        <div class="loupe-hud" id="loupe-hud">
          <div class="lh-tl" id="loupe-tl"></div>
          <div class="lh-tr">
            <div class="lh-btns" id="loupe-btns"><div class="lh-fps" id="loupe-fps" aria-hidden="true"></div></div>
            <div class="lh-keys" id="loupe-keys"></div>
          </div>
          <div class="lh-explorer" id="loupe-explorer"></div>
          <div class="dive-readout" id="dive-readout" aria-hidden="true"></div>
          <div class="loupe-tools">
            <div class="scale-legend" id="scale-legend" aria-label="Scale circles round the atom, by diameter"></div>
            <div class="style-switch" id="style-switch" role="group" aria-label="The nucleus up close"></div>
          </div>
        </div>
        <div class="view-next" id="view-next" hidden></div>
      </section>
    </div>

    <div id="app" hidden>
      <canvas id="overlay" aria-label="The puzzle. Swipe to slide nuclei, or drag round a ring to turn it."></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="edge" id="edge" aria-hidden="true">ATOMOS 400 &#9656; PLATE 0001</div>

      <div class="build-bar" id="build-bar"></div>
      <section class="build-home" id="build-home" aria-label="Build this atom">
        <div class="bh-stage" id="bh-stage">
          <canvas id="bh-atom" aria-label="The atom you are building."></canvas>
          <div class="bh-empty" id="bh-empty" hidden>Nucleus not built</div>
          <div class="bh-rings" id="bh-progress" role="img"></div>
          <ul class="bh-scale" id="bh-scale" aria-label="Size circles round the atom, by diameter" hidden></ul>
        </div>
        <div class="bh-in" id="bh-in"></div>
      </section>
      <div class="build-head" id="build-head" hidden></div>

      <div class="bottom" id="build-foot"></div>

    </div>

    <section id="puzzles-screen" hidden aria-label="Practice">
      <div class="pg-home" id="pg-home">
        <div class="pg-home-in">
          <div class="pg-home-head" id="pg-home-head"><h1 class="pg-home-title">Practice</h1></div>
          <p class="pg-home-lede">Practice any game on any atom. Practice doesn't build atoms.</p>
          <div id="pg-list"></div>
        </div>
      </div>
      <div class="pg-game" id="pg-game" hidden>
        <div class="pg-gbar" id="pg-gbar"></div>
        <div class="pg-play" id="pg-play">
          <canvas id="pg-canvas" aria-label="The puzzle."></canvas>
        </div>
        <div class="pg-planned" id="pg-planned" hidden>
          <p class="pg-result">Not built yet</p>
          <p class="muted">On the progression map, with no board to play yet.</p>
        </div>
        <div class="pg-foot" id="pg-foot">
          <div class="pg-gen" id="pg-gen"><div class="pg-bar" id="pg-bar" hidden></div></div>
        </div>
      </div>
    </section>

    <section id="settings-screen" class="settings-screen" hidden aria-label="Settings">
      <div class="sheet settings-page" id="settings-page"></div>
    </section>

    <section id="icons-screen" class="settings-screen" hidden aria-label="Icons">
      <div class="icon-page" id="icon-page"></div>
    </section>

    <section id="components-screen" class="settings-screen" hidden aria-label="Components">
      <div class="icon-page cl-page" id="component-page"></div>
    </section>

    <div class="modal ui-modal" id="modal" hidden>
      <div class="sheet ui-modal-card" id="modal-sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
