<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101112" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atomos" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="description" content="Every atom, up close. Atomos: a collection of the 118 elements, unlocked puzzle by puzzle." />
    <title>Atomos</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="nav" id="nav" aria-label="Main">
      <button class="nav-logo" id="nav-logo" aria-label="Atomos: back to the gallery" title="Atomos"></button>
      <nav class="nav-tabs" aria-label="Sections">
        <button id="nav-gallery" aria-current="page"><span class="nav-ico"></span><span class="nav-lab">Gallery</span></button>
        <button id="nav-atom" aria-current="false"><span class="nav-ico"></span><span class="nav-lab">Atom</span></button>
        <button id="nav-puzzles" aria-current="false"><span class="nav-ico"></span><span class="nav-lab">Puzzles</span></button>
        <button id="nav-settings" aria-current="false"><span class="nav-ico"></span><span class="nav-lab">Settings</span></button>
      </nav>
      <div class="nav-end" aria-hidden="true"></div>
    </header>

    <!-- Atom screens: pick View or Build for this atom; Build shows its progress.
         See src/ui/modebar.ts. -->
    <div class="mode-row" id="mode-row" hidden>
      <div class="mode-seg" id="mode-seg"></div>
    </div>

    <div id="gallery-screen">
      <canvas id="gal" aria-label="Every element as an atom. Drag to move, pinch to zoom, tap one to look closer."></canvas>
      <div id="gal-labels" class="gal-labels" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <header class="gal-top">
        <div class="gal-title">
          <span class="gal-sub"><span id="gal-count">0 of 118</span> collected</span>
        </div>
      </header>
      <div class="gal-hover" id="gal-hover" hidden></div>
      <footer class="gal-bottom">
        <div class="seg layout-switch" id="layout-switch" role="group" aria-label="Arrangement"></div>
        <p class="layout-note" id="layout-note"></p>
      </footer>

      <section id="loupe-screen" class="loupe-screen" hidden aria-label="One atom, up close">
        <div class="atom-tabs" id="atom-tabs"></div>
        <div class="atom-panel" id="atom-panel" role="tabpanel" hidden></div>
        <canvas id="loupe" aria-label="The selected atom. Drag to turn it; the arrows below step to the neighboring elements."></canvas>
        <div class="dec dec-tl" id="dec-top-left" aria-label="Electron configuration, shells, layers, electrons and size"></div>
        <div class="dec dec-tr" id="dec-top-right" aria-label="Isotopes"></div>
        <div class="loupe-tools">
          <div class="scale-legend" id="scale-legend" aria-label="Scale circles round the atom, by diameter"></div>
          <div class="style-switch" id="style-switch" role="group" aria-label="How the atom is drawn"></div>
        </div>
      </section>
    </div>

    <div id="app" hidden>
      <canvas id="atom" aria-label="The atom you are building."></canvas>
      <canvas id="overlay" aria-label="The puzzle. Swipe to slide nuclei, or drag round a ring to turn it."></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="edge" id="edge" aria-hidden="true">ATOMOS 400 &#9656; PLATE 0001</div>

      <section class="build-home" id="build-home" aria-label="Build this atom">
        <div class="bh-in" id="bh-in"></div>
      </section>
      <div class="pg-head build-head" id="build-head" hidden></div>

      <div class="stage" id="stage" aria-live="polite"></div>

      <div class="bottom">
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <div class="bottom-actions" id="build-actions"></div>
      </div>

    </div>

    <section id="puzzles-screen" hidden aria-label="Puzzles">
      <div class="pg-home" id="pg-home">
        <div class="pg-home-in">
          <div class="pg-home-head" id="pg-home-head"><h1 class="pg-home-title">Puzzles</h1></div>
          <p class="pg-home-lede">Atoms are unlocked by puzzles. Here is every puzzle type, what it is for in the game, and whether the game uses it yet. Tap one to play it on any element.</p>
          <div id="pg-list"></div>
        </div>
      </div>
      <div class="pg-game" id="pg-game" hidden>
        <div class="pg-head" id="pg-head"></div>
        <div class="pg-bar" id="pg-bar"></div>
        <div class="pg-play" id="pg-play">
          <canvas id="pg-canvas" aria-label="The puzzle."></canvas>
        </div>
        <div class="pg-planned" id="pg-planned" hidden>
          <p class="pg-result">Not built yet</p>
          <p class="muted">On the progression map, with no board to play yet.</p>
        </div>
        <div class="pg-bottom" id="pg-bottom">
          <div class="pg-status"><span class="pg-count" id="pg-count"></span><span class="pg-hint" id="pg-hint" role="status" aria-live="polite"></span></div>
          <div class="pg-actions" id="pg-actions"></div>
        </div>
      </div>
    </section>

    <section id="settings-screen" class="settings-screen" hidden aria-label="Settings">
      <div class="sheet settings-page" id="settings-page"></div>
    </section>

    <section id="icons-screen" class="settings-screen" hidden aria-label="Icons">
      <div class="icon-page" id="icon-page"></div>
    </section>

    <div class="modal ui-modal" id="modal" hidden>
      <div class="sheet ui-modal-card" id="modal-sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
