<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101112" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atomos" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="description" content="Every atom, up close. Atomos: a collection of the 118 elements, unlocked puzzle by puzzle." />
    <title>Atomos</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="nav" id="nav" aria-label="Main">
      <nav class="nav-tabs">
        <button id="nav-gallery" aria-current="page">Gallery</button>
        <button id="nav-atom" aria-current="false">Atom</button>
        <button id="nav-puzzles" aria-current="false">Puzzles</button>
      </nav>
      <div class="seg nav-mode" id="nav-mode" role="group" aria-label="Atom mode" hidden>
        <button id="mode-view" aria-pressed="true">View</button>
        <button id="mode-build" aria-pressed="false">Build</button>
      </div>
      <button class="nav-icon" id="nav-science" aria-label="More about what is on screen" aria-expanded="false" hidden></button>
      <button class="nav-icon" id="nav-settings" aria-label="Settings" title="Settings"></button>
    </header>

    <div id="gallery-screen">
      <canvas id="gal" aria-label="Every element as an atom. Drag to move, pinch to zoom, tap one to look closer."></canvas>
      <div id="gal-labels" class="gal-labels" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <header class="gal-top">
        <div class="gal-title">
          <span class="gal-name"><span class="gal-mark" id="gal-mark"></span>Atomos</span>
          <span class="gal-sub"><span id="gal-count">0 of 118</span> collected</span>
        </div>
      </header>
      <div class="gal-hover" id="gal-hover" hidden></div>
      <footer class="gal-bottom">
        <div class="seg layout-switch" id="layout-switch" role="group" aria-label="Arrangement"></div>
        <p class="layout-note" id="layout-note"></p>
      </footer>

      <section id="loupe-screen" class="loupe-screen" hidden aria-label="One atom, up close">
        <canvas id="loupe" aria-label="The selected atom. Drag to turn it; the arrows below step to the neighbouring elements."></canvas>
        <div class="dec dec-tl" id="dec-top-left" aria-label="Electron configuration, shells, layers, electrons and size"></div>
        <div class="dec dec-tr" id="dec-top-right" aria-label="Isotopes"></div>
        <div class="loupe-tools">
          <div class="scale-legend" id="scale-legend" aria-label="Scale circles round the atom, by diameter"></div>
          <div class="style-switch" id="style-switch" role="group" aria-label="How the atom is drawn"></div>
        </div>
        <footer class="loupe-bar">
          <button class="bar-arrow" id="loupe-prev" aria-label="Previous element"></button>
          <div class="bar-mid">
            <button class="bar-pick" id="bar-pick" aria-haspopup="dialog" aria-label="Choose another element"></button>
            <span class="bar-name" id="dec-name"></span>
          </div>
          <button class="bar-arrow" id="loupe-next" aria-label="Next element"></button>
        </footer>
      </section>
    </div>

    <div id="app" hidden>
      <canvas id="atom" aria-label="The atom you are building."></canvas>
      <canvas id="overlay" aria-label="The puzzle. Swipe to slide nuclei, or drag round a ring to turn it."></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="edge" id="edge" aria-hidden="true">ATOMOS 400 &#9656; PLATE 0001</div>

      <header class="top">
        <button class="badge" id="badge" aria-label="Open this element's card">
          <span class="badge-z" id="badge-z">1</span>
          <span class="badge-sym" id="badge-sym">H</span>
          <span class="badge-text">
            <span class="badge-name" id="badge-name">Hydrogen</span>
            <span class="badge-config" id="badge-config">bare nucleus</span>
          </span>
        </button>
      </header>

      <div class="stage" id="stage" aria-live="polite"></div>

      <div class="bottom">
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <div class="bottom-actions">
          <button class="text-btn" id="btn-undo">Undo</button>
          <button class="text-btn" id="btn-restart">Restart puzzle</button>
          <button class="science-btn" id="btn-why" aria-label="The science behind this puzzle" title="The science behind this puzzle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5 7.5 5l6 6 1.5-1.5z"/><path d="M8.5 6 6 8.5l3.5 3.5"/><path d="M13 11.5c2.2 1.6 3.3 4.2 2.6 6.8"/><path d="M6 20.5h12"/><path d="M10 20.5c-1.8-.5-3-2-3-3.8"/><path d="M13.5 17.5H19"/></svg></button>
        </div>
      </div>

    </div>

    <section id="puzzles-screen" hidden aria-label="Puzzle playground">
      <div class="pg-types" id="pg-types"></div>
      <div class="pg-head">
        <div class="pg-about">
          <h2 id="pg-title">Merge</h2>
          <p class="pg-blurb" id="pg-blurb"></p>
          <p class="pg-role" id="pg-role"></p>
        </div>
        <div class="pg-pick">
          <button class="arrow-sm" id="pg-prev" aria-label="Previous element">‹</button>
          <span class="pg-el" id="pg-el"></span>
          <button class="arrow-sm" id="pg-next" aria-label="Next element">›</button>
          <input type="range" id="pg-range" min="1" max="118" value="6" aria-label="Element" />
          <button class="text-btn" id="pg-deal">New deal</button>
          <span class="pg-dealno" id="pg-dealno">deal 1</span>
        </div>
      </div>
      <div class="pg-play" id="pg-play">
        <canvas id="pg-canvas" aria-label="The puzzle."></canvas>
        <div class="pg-done" id="pg-done" hidden>
          <span class="stamp" id="pg-result"></span>
          <div class="actions">
            <button class="primary" id="pg-again">New deal</button>
            <button class="secondary" id="pg-nextel">Next element</button>
          </div>
        </div>
      </div>
      <div class="pg-planned" id="pg-planned" hidden>
        <p class="stamp">Not built yet</p>
        <p class="muted">This one is on the progression map but has no board to play. It is next in line.</p>
      </div>
      <div class="pg-bottom">
        <p class="message" id="pg-hint" role="status" aria-live="polite"></p>
        <div class="bottom-actions">
          <span class="pg-count" id="pg-count"></span>
          <button class="text-btn" id="pg-undo">Undo</button>
          <button class="text-btn" id="pg-restart">Restart</button>
          <button class="science-btn" id="pg-science" aria-label="The science behind this puzzle" title="The science behind this puzzle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5 7.5 5l6 6 1.5-1.5z"/><path d="M8.5 6 6 8.5l3.5 3.5"/><path d="M13 11.5c2.2 1.6 3.3 4.2 2.6 6.8"/><path d="M6 20.5h12"/><path d="M10 20.5c-1.8-.5-3-2-3-3.8"/><path d="M13.5 17.5H19"/></svg></button>
        </div>
      </div>
    </section>

    <div class="modal ui-modal" id="modal" hidden>
      <div class="sheet ui-modal-card" id="modal-sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
    <div class="ui-modal atom-modal" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="ui-modal-card atom-card" id="sheet-card">
        <div class="ui-modal-head atom-head">
          <h2 id="sheet-title"></h2>
        </div>
        <div id="sheet-tabs"></div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>
  </body>
</html>
