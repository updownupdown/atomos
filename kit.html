<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atomos UI kit</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { overflow: auto; }
      .kit { max-width: 560px; margin: 0 auto; padding: var(--sp-5) var(--sp-4) 80px; display: flex; flex-direction: column; gap: var(--sp-5); }
      .kit h1 { font-size: var(--fs-xl); font-weight: var(--fw-semibold); margin: 0; }
      .kit h2 { font-size: var(--fs-xs); font-weight: var(--fw-medium); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--c-text-2); margin: 0 0 var(--sp-2); }
      .kit .row { display: flex; align-items: center; gap: var(--sp-3); }
      .kit .out { font-size: var(--fs-sm); color: var(--c-text-2); font-variant-numeric: tabular-nums; min-width: 9ch; }
    </style>
  </head>
  <body>
    <main class="kit" id="kit"><h1>Shared components</h1></main>
    <div class="modal ui-modal" id="modal" hidden>
      <div class="sheet ui-modal-card" id="modal-sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/ui/kit.ts"></script>
  </body>
</html>
